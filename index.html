<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game </title>


    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
</head>

<body>
    <div class="game-card">
    <div class="header">
      <h1>لعبة الثعبان 🐍</h1>
    </div>

    <div class="score-board">
      <div>النقاط: <span id="score">0</span></div>
      <div>أعلى نتيجة: <span id="highScore">0</span></div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- رسالة البداية -->
      <div class="start-msg" id="startMsg">اضغط الأزرار للبدء 🎮</div>

      <!-- Overlay Game Over -->
      <div class="overlay" id="gameOverOverlay">
        <h2>انتهت اللعبة! 💀</h2>
        <p>النقاط النهائية: <strong id="finalScore" style="color: #38bdf8;">0</strong></p>
        <button class="btn-start" onclick="resetGame()">العب مجدداً 🔄</button>
      </div>
    </div>
  </div>

</body>

</html>
